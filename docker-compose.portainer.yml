# Paste this as the Portainer stack compose (Web editor).
# Upload stack.env as the environment file (Load variables from .env file).
# Requires image built once on the host: bash scripts/build-image.sh

services:
  orijaflix:
    image: orijaflix:latest
    pull_policy: never
    container_name: orijaflix
    ports:
      - "${ORIJA_PORT:-8096}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MAX_STREAMS_PER_USER: ${MAX_STREAMS_PER_USER}
      MAX_GLOBAL_STREAMS: ${MAX_GLOBAL_STREAMS}
      XTREAM_BASE_URL: ${XTREAM_BASE_URL}
      XTREAM_USERNAME: ${XTREAM_USERNAME}
      XTREAM_PASSWORD: ${XTREAM_PASSWORD}
      TMDB_API_KEY: ${TMDB_API_KEY}
      DATABASE_URL: sqlite+aiosqlite:////data/orijaflix.db
      MEDIA_ROOT: /srv/storage/data/media
      MOVIES_DIR: /srv/storage/data/media/movies
      SHOWS_DIR: /srv/storage/data/media/TVshows
      LIVE_DIR: /srv/storage/data/media/live
      DOWNLOADS_DIR: /srv/storage/data/media/downloads
      INCOMING_DIR: /srv/storage/data/media/incoming
    volumes:
      - orijaflix-data:/data
      - ${MEDIA_HOST_PATH}:/srv/storage/data/media
    restart: unless-stopped

volumes:
  orijaflix-data:
