<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VerseCast — Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/overlay.css" />
  <style>
    body.preview-stage {
      background:
        radial-gradient(ellipse at 20% 0%, rgba(40, 90, 110, 0.35), transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(20, 50, 40, 0.4), transparent 45%),
        linear-gradient(160deg, #1a2830 0%, #0d151a 55%, #152018 100%);
      min-height: 100vh;
    }
    .stage-label {
      position: fixed;
      top: 16px;
      left: 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(245, 240, 232, 0.45);
    }
  </style>
</head>
<body class="preview-stage">
  <div class="stage-label">OBS Preview · 1920×1080 safe</div>
  <div id="lower-third" class="lower-third hidden" aria-live="polite">
    <div class="lt-accent"></div>
    <div class="lt-body">
      <div class="lt-reference"></div>
      <div class="lt-text"></div>
    </div>
  </div>
  <div id="captions" class="captions hidden" aria-live="polite">
    <div class="captions-text"></div>
  </div>
  <script src="/assets/overlay-client.js"></script>
  <script>
    initOverlay({ mode: 'preview' });
  </script>
</body>
</html>
