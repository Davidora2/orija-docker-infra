services:
  photo-request:
    build: .
    container_name: immich-photo-request
    restart: unless-stopped
    ports:
      # High host port for Cloudflare Tunnel / reverse proxy origin
      - "18090:8090"
    environment:
      APP_NAME: Immich Photo Request
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://request.photos.orija.store}
      IMMICH_BASE_URL: ${IMMICH_BASE_URL:-https://photos.orija.store}
      EXTERNAL_LIBRARY_ROOT: /data/external
      DATABASE_PATH: /data/app.db
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-99614720}
      MAX_FILES_PER_REQUEST: ${MAX_FILES_PER_REQUEST:-200}
      DEFAULT_EXPIRY_DAYS: ${DEFAULT_EXPIRY_DAYS:-14}
      IMMICH_SCAN_API_KEY: ${IMMICH_SCAN_API_KEY:-}
      IMMICH_LIBRARY_ID: ${IMMICH_LIBRARY_ID:-}
      DEV_MODE: ${DEV_MODE:-false}
    volumes:
      # Mount the same directory Immich uses for an external library (bind mount or SMB).
      # Example SMB host mount: //nas/photos/immich-inbox -> /mnt/immich-inbox
      - ${IMMICH_EXTERNAL_HOST_PATH:-./data/external}:/data/external
      - ${PHOTO_REQUEST_DATA:-./data/app}:/data
