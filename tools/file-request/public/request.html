<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upload files</title>
    <base href="../../" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="shell">
      <section class="hero-request">
        <p class="pill" id="statusPill">Loading…</p>
        <h1 id="title">File request</h1>
        <p id="description"></p>
      </section>

      <section class="panel stack" id="uploadPanel" hidden>
        <div>
          <label for="uploaderName">Your name (optional)</label>
          <input id="uploaderName" type="text" placeholder="Alex" />
        </div>
        <div>
          <label for="note">Note (optional)</label>
          <input id="note" type="text" placeholder="From Saturday dinner" />
        </div>

        <div class="dropzone" id="dropzone">
          <strong>Drop photos or videos here</strong>
          <span class="muted">No size limit. Large files are sent in 8MB pieces.</span>
          <input id="fileInput" type="file" accept="image/*,video/*,.heic,.heif" multiple hidden />
        </div>

        <div id="selected" class="muted"></div>
        <button class="btn" id="uploadBtn" type="button" disabled>Upload</button>
        <p id="progress" class="muted"></p>
      </section>

      <section class="panel" id="closedPanel" hidden>
        <p style="margin:0" class="muted">This file request is closed. New uploads are no longer accepted.</p>
      </section>

      <section class="panel" id="missingPanel" hidden>
        <p style="margin:0" class="muted">This file request link is invalid or expired.</p>
      </section>
    </div>

    <div class="toast" id="toast"></div>
    <script src="js/request.js" type="module"></script>
  </body>
</html>
