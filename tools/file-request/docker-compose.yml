name: file-request

services:
  file-request:
    build: .
    image: file-request:local
    container_name: file-request
    ports:
      - "${PORT:-3847}:3847"
    extra_hosts:
      # Reach Immich (or any service) published on the same host
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3847"
      BASE_URL: ${BASE_URL:-http://localhost:3847}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      DATA_DIR: /app/data
      UPLOAD_ROOT: /app/data/uploads
      MAX_FILE_MB: ${MAX_FILE_MB:-100}
      # Immich on the same host, default published port
      IMMICH_URL: ${IMMICH_URL:-http://host.docker.internal:2283}
      IMMICH_FOLDERS: ${IMMICH_FOLDERS:-Inbox=/immich/inbox,Family=/immich/family,Vacation=/immich/vacation}
    volumes:
      - ./data:/app/data
      - ${IMMICH_INBOX:-./data/immich-external/inbox}:/immich/inbox
      - ${IMMICH_FAMILY:-./data/immich-external/family}:/immich/family
      - ${IMMICH_VACATION:-./data/immich-external/vacation}:/immich/vacation
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3847/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
