# OrijaFlix — Portainer uploadable stack
# Repo is public: builds directly from GitHub (no token needed).
# Portainer: Stacks → Upload this file → Deploy
# First deploy builds the image (several minutes).

services:
  orijaflix:
    build:
      context: https://github.com/Davidora2/orija-docker-infra.git#cursor/xtream-media-server-8dc5
      dockerfile: Dockerfile
    image: orijaflix:latest
    container_name: orijaflix
    ports:
      - "8096:8000"
    environment:
      SECRET_KEY: orijaflix-1956
      ADMIN_USERNAME: 
      MAX_STREAMS_PER_USER: "4"
      MAX_GLOBAL_STREAMS: "20"
      XTREAM_BASE_URL: 
      XTREAM_USERNAME: efb57ecb29b3
      XTREAM_PASSWORD: 1302cabedc
      TMDB_API_KEY: d604e223a1bc1c58157eccbb2616befe
      DATABASE_URL: sqlite+aiosqlite:////data/orijaflix.db
      MEDIA_ROOT: /srv/storage/data/media
      MOVIES_DIR: /srv/storage/data/media/movies
      SHOWS_DIR: /srv/storage/data/media/TVshows
      LIVE_DIR: /srv/storage/data/media/live
      DOWNLOADS_DIR: /srv/storage/data/media/downloads
      INCOMING_DIR: /srv/storage/data/media/incoming
    volumes:
      - orijaflix-data:/data
      - /srv/storage/data/media:/srv/storage/data/media
    restart: unless-stopped

volumes:
  orijaflix-data:
