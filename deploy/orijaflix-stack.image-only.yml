# Alternative: build image ONCE on the Docker host, then use image-only stack.
# Run these commands on the same machine that runs Portainer/Docker:

# git clone https://github.com/Davidora2/orija-docker-infra.git
# cd orija-docker-infra
# git checkout cursor/xtream-media-server-8dc5
# docker compose -f docker-compose.local.yml build
# docker tag orijaflix:local orijaflix:latest
#
# Then deploy deploy/orijaflix-stack.image-only.yml in Portainer.

services:
  orijaflix:
    image: orijaflix:latest
    pull_policy: never
    container_name: orijaflix
    ports:
      - "8096:8000"
    environment:
      SECRET_KEY: orijaflix-change-this-to-a-long-random-string
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Olaore123!
      MAX_STREAMS_PER_USER: "4"
      MAX_GLOBAL_STREAMS: "20"
      XTREAM_BASE_URL:
      XTREAM_USERNAME: 
      TMDB_API_KEY: d604e223a1bc1c58157eccbb2616befe
      DATABASE_URL: sqlite+aiosqlite:////data/orijaflix.db
      MEDIA_ROOT: /srv/storage/data/media
      MOVIES_DIR: /srv/storage/data/media/movies
      SHOWS_DIR: /srv/storage/data/media/TVshows
      LIVE_DIR: /srv/storage/data/media/live
      DOWNLOADS_DIR: /srv/storage/data/media/downloads
      INCOMING_DIR: /srv/storage/data/media/incoming
    volumes:
      - orijaflix-data:/data
      - /srv/storage/data/media:/srv/storage/data/media
    restart: unless-stopped

volumes:
  orijaflix-data:
