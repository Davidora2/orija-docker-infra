# Portainer / Cloudflare Tunnel stack (no Docker build — avoids CF 524 timeouts).
# Public origin for your existing tunnel:
#   Hostname: lifeos.orija.store
#   Service:  http://localhost:8088
#   (or http://172.17.0.1:8088 / http://caddy:80 on the life-os network)
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - life-os-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [life-os]

  api:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /opt/life-os
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgres://lifeos:${POSTGRES_PASSWORD}@postgres:5432/lifeos
      JWT_SECRET: ${JWT_SECRET}
      APP_ORIGINS: https://${LIFE_OS_DOMAIN}
      PUBLIC_APP_URL: https://${LIFE_OS_DOMAIN}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_DAYS: 30
      AUTO_MIGRATE: "true"
      LIFE_OS_REPO_URL: https://github.com/Davidora2/orija-docker-infra.git
      LIFE_OS_REPO_REF: refs/heads/cursor/life-os-planning-docs-c38b
    volumes:
      - life-os-api-src:/opt/life-os
      - ./deploy/portainer-entrypoint-api.sh:/entrypoint.sh:ro
    command: ["sh", "/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s
    networks: [life-os]

  web:
    image: node:22-alpine
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      LIFE_OS_REPO_URL: https://github.com/Davidora2/orija-docker-infra.git
      LIFE_OS_REPO_REF: refs/heads/cursor/life-os-planning-docs-c38b
    volumes:
      - life-os-web-src:/opt/life-os
      - ./deploy/portainer-entrypoint-web.sh:/entrypoint.sh:ro
    command: ["sh", "/entrypoint.sh"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s
    networks: [life-os]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./deploy/Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
    networks: [life-os]

networks:
  life-os:
    name: life-os

volumes:
  life-os-postgres:
  life-os-api-src:
  life-os-web-src:
