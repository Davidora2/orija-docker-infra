[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orija-trading-agent"
version = "0.1.0"
description = "Risk-controlled AI trading agent with paper trading by default"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
trade-agent = "trading_agent.cli:app"

[tool.setuptools.packages.find]
include = ["trading_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
