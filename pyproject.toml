[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-insider-scout"
version = "0.1.0"
description = "Rank SEC Form 4 insider filings and surface research trade ideas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dateutil>=2.9.0",
  "jinja2>=3.1.4",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
]

[project.scripts]
insider-scout = "sec_insider_scout.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sec_insider_scout*"]

[tool.setuptools.package-data]
sec_insider_scout = ["static/*", "templates/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
