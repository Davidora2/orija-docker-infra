# WordPress site stack — generated by scripts/new-site.sh from templates/site/compose.yml

services:
  db:
    image: mariadb:11.4
    container_name: wp-studio-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wp-internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    labels:
      - "com.orija.stack=wp-studio"
      - "com.orija.site=studio"
      - "com.orija.role=database"
      - "com.orija.owner=bob"

  wordpress:
    image: wordpress:6.7-php8.2-apache
    container_name: wp-studio-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WP_REDIS_HOST: wp-redis
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://studio.orija.store');
        define('WP_SITEURL', 'https://studio.orija.store');
        define('WP_REDIS_HOST', 'wp-redis');
        define('WP_REDIS_PORT', 6379);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wp_data:/var/www/html
    networks:
      - wp-internal
      - wp-public
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/wp-admin/install.php >/dev/null || curl -fsS http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "com.orija.stack=wp-studio"
      - "com.orija.site=studio"
      - "com.orija.role=wordpress"
      - "com.orija.owner=bob"
      - "com.orija.domain=studio.orija.store"
      - "traefik.enable=true"
      - "traefik.docker.network=wp-public"
      - "traefik.http.routers.wp-studio.rule=Host(`studio.orija.store`)"
      - "traefik.http.routers.wp-studio.entrypoints=web"
      - "traefik.http.routers.wp-studio.service=wp-studio"
      - "traefik.http.services.wp-studio.loadbalancer.server.port=80"
      - "traefik.http.middlewares.wp-studio-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.wp-studio.middlewares=wp-studio-headers"

networks:
  wp-internal:
    name: wp-studio-internal
    driver: bridge
    internal: true
  wp-public:
    external: true
    name: wp-public

volumes:
  db_data:
    name: wp_studio_db
  wp_data:
    name: wp_studio_data
