user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  limit_req_zone $binary_remote_addr zone=ingest_limit:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

  server {
    listen 8080;
    client_max_body_size 1m;
    root /app/web/admin;
    absolute_redirect off;
    port_in_redirect off;

    location = / {
      return 302 /admin/;
    }

    location = /admin {
      return 302 /admin/;
    }

    location /admin/ {
      alias /app/web/admin/;
      index index.html;
    }

    location /join/ {
      alias /app/web/join/;
      index index.html;
      add_header Cache-Control "no-store" always;
    }

    location = /join/sw.js {
      alias /app/web/join/sw.js;
      add_header Cache-Control "no-store" always;
      add_header Service-Worker-Allowed "/join/";
      default_type application/javascript;
    }

    location = /join {
      return 302 /join/;
    }

    location /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"gateway"}';
    }

    location /v1/public {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://127.0.0.1:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/member {
      limit_req zone=api_limit burst=60 nodelay;
      client_max_body_size 32m;
      proxy_pass http://127.0.0.1:8001;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Member-Token $http_x_member_token;
      proxy_buffering off;
    }

    location /v1/admin {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://127.0.0.1:8001;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Bootstrap-Token $http_x_bootstrap_token;
    }

    location /v1/homes {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://127.0.0.1:8001;
      proxy_set_header Authorization $http_authorization;
    }

    location /v1/push-tokens {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://127.0.0.1:8001;
      proxy_set_header Authorization $http_authorization;
    }

    location /v1/devices {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://127.0.0.1:8001;
      proxy_set_header Authorization $http_authorization;
    }

    location /v1/webhooks/ring {
      limit_req zone=ingest_limit burst=20 nodelay;
      proxy_pass http://127.0.0.1:8002;
      proxy_set_header X-API-Key $http_x_api_key;
      proxy_set_header X-Webhook-Secret $http_x_webhook_secret;
    }

    location /v1/simulate/ring {
      limit_req zone=ingest_limit burst=20 nodelay;
      proxy_pass http://127.0.0.1:8002;
      proxy_set_header X-API-Key $http_x_api_key;
    }

    location /v1/internal/ {
      return 404;
    }
  }
}
