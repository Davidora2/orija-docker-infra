user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  # Basic hardening
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  limit_req_zone $binary_remote_addr zone=ingest_limit:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

  upstream home_registry {
    server home-registry:8000;
  }

  upstream ring_ingest {
    server ring-ingest:8000;
  }

  server {
    listen 8080;
    client_max_body_size 1m;
    root /app/web/admin;
    # Keep browser on the published host port (e.g. 18091), not container 8080
    absolute_redirect off;
    port_in_redirect off;

    location = / {
      return 302 /admin/;
    }

    location = /admin {
      return 302 /admin/;
    }

    location /admin/ {
      alias /app/web/admin/;
      index index.html;
    }

    location /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"gateway"}';
    }

    location /v1/admin {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://home_registry;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Bootstrap-Token $http_x_bootstrap_token;
    }

    location /v1/homes {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://home_registry;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Bootstrap-Token $http_x_bootstrap_token;
    }

    location /v1/push-tokens {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://home_registry;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Bootstrap-Token $http_x_bootstrap_token;
    }

    location /v1/devices {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://home_registry;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Bootstrap-Token $http_x_bootstrap_token;
    }

    location /v1/webhooks/ring {
      limit_req zone=ingest_limit burst=20 nodelay;
      proxy_pass http://ring_ingest;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-API-Key $http_x_api_key;
      proxy_set_header X-Webhook-Secret $http_x_webhook_secret;
    }

    location /v1/simulate/ring {
      limit_req zone=ingest_limit burst=20 nodelay;
      proxy_pass http://ring_ingest;
      proxy_set_header Host $host;
      proxy_set_header X-API-Key $http_x_api_key;
      proxy_set_header Content-Type $content_type;
    }

    # Block direct access to internal registry endpoints via the public gateway
    location /v1/internal/ {
      return 404;
    }
  }
}
