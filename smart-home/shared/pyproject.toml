[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homepulse"
version = "0.1.0"
description = "Shared contracts for the HomePulse smart-home platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "redis>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["homepulse*"]
