        cp /app/services/ring-ingest/app.py /run/app.py
        cd /run
        exec uvicorn app:app --host 0.0.0.0 --port 8000
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      home-registry:
        condition: service_started

    networks: [homepulse]


