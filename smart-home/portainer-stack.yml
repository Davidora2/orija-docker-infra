    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
    volumes:
      - homepulse-hass-config:/config
    ports:
      - "${HASS_PORT:-18123}:8123"
    depends_on:
      seed:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    networks: [homepulse]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-18091}:8080"
    volumes:
      - homepulse-app:/app:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cp /app/config/nginx/nginx.conf /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    depends_on:
      seed:
        condition: service_completed_successfully
      home-registry:
        condition: service_started
      ring-ingest:
        condition: service_started
      frigate:
        condition: service_started
    networks: [homepulse]

