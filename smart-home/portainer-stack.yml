      - |
        set -eu
        test -f /app/shared/pyproject.toml || (echo "App bundle missing — redeploy stack" && exit 1)


        pip install --no-cache-dir -q /app/shared -r /app/services/scheduler/requirements.txt
        cp /app/services/scheduler/worker.py /run/worker.py
        cd /run
        exec python worker.py
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      home-registry:
        condition: service_healthy

    networks: [homepulse]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-18091}:8080"
    volumes:
      - homepulse-app:/app:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cp /app/config/nginx/nginx.conf /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    depends_on:
      seed:
        condition: service_completed_successfully
      home-registry:
        condition: service_healthy
      ring-ingest:
        condition: service_healthy
    networks: [homepulse]

networks:
  homepulse:
    driver: bridge

volumes:
  homepulse-app:
  homepulse-postgres:
  homepulse-redis:
  homepulse-secrets:
