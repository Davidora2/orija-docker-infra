    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      home-registry:
        condition: service_started

    networks: [homepulse]


  mqtt-commander:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /run
    environment:
      REDIS_URL: redis://redis:6379/0
      REGISTRY_URL: http://home-registry:8000
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOSTNAME: mqtt-commander-1
    volumes:
      - homepulse-app:/app:ro

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        test -f /app/shared/pyproject.toml || (echo "App bundle missing — redeploy stack" && exit 1)


        cp -a /app/shared /tmp/shared
        pip install --no-cache-dir -q /tmp/shared -r /app/services/mqtt-commander/requirements.txt
        cp /app/services/mqtt-commander/worker.py /run/worker.py
        cd /run
        exec python worker.py
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      home-registry:
        condition: service_started
      mosquitto:
        condition: service_started

    networks: [homepulse]


  scheduler:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /run
    environment:
      REDIS_URL: redis://redis:6379/0
      REGISTRY_URL: http://home-registry:8000
      LOCK_CHECK_INTERVAL_SECONDS: ${LOCK_CHECK_INTERVAL_SECONDS:-60}
      SUNSET_HOUR_LOCAL: ${SUNSET_HOUR_LOCAL:-20}
      SUNSET_MINUTE_LOCAL: ${SUNSET_MINUTE_LOCAL:-0}
      AUTO_LOCK_AFTER_SUNSET: ${AUTO_LOCK_AFTER_SUNSET:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - homepulse-app:/app:ro

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        test -f /app/shared/pyproject.toml || (echo "App bundle missing — redeploy stack" && exit 1)


        cp -a /app/shared /tmp/shared
        pip install --no-cache-dir -q /tmp/shared -r /app/services/scheduler/requirements.txt
        cp /app/services/scheduler/worker.py /run/worker.py
        cd /run
        exec python worker.py
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      home-registry:
        condition: service_started

    networks: [homepulse]


  ha-ingest:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /run
    environment:
      REDIS_URL: redis://redis:6379/0
      REGISTRY_URL: http://home-registry:8000
      HA_BASE_URL: ${HA_BASE_URL:-http://homeassistant:8123}
      HA_TOKEN: ${HA_TOKEN:-}
      HA_TOKEN_FILE: /secrets/ha-token.txt
      NOTIFY_ON_MOTION: ${NOTIFY_ON_MOTION:-false}
      HA_INGEST_DEBOUNCE_SECONDS: ${HA_INGEST_DEBOUNCE_SECONDS:-8}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - homepulse-app:/app:ro
      - homepulse-secrets:/secrets:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        test -f /app/shared/pyproject.toml || (echo "App bundle missing — redeploy stack" && exit 1)


        cp -a /app/shared /tmp/shared
        pip install --no-cache-dir -q /tmp/shared -r /app/services/ha-ingest/requirements.txt
        cp /app/services/ha-ingest/worker.py /run/worker.py
        cd /run
        exec python worker.py
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      home-registry:
        condition: service_started
      homeassistant:
        condition: service_started

    networks: [homepulse]

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    shm_size: "256mb"
    environment:
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD:-homepulse}
    volumes:
      - homepulse-frigate-config:/config
      - homepulse-frigate-media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 512000000
    depends_on:
      seed:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
      home-registry:
        condition: service_started
    networks: [homepulse]

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
    volumes:
      - homepulse-hass-config:/config
    ports:
      - "${HASS_PORT:-18123}:8123"
    depends_on:
      seed:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    networks: [homepulse]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-18091}:8080"
    volumes:
      - homepulse-app:/app:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cp /app/config/nginx/nginx.conf /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    depends_on:
      seed:
        condition: service_completed_successfully
      home-registry:
        condition: service_started
      ring-ingest:
        condition: service_started
      frigate:
        condition: service_started
    networks: [homepulse]

networks:
  homepulse:
    driver: bridge

volumes:
  homepulse-app:
  homepulse-pgdata:
  homepulse-redis:
  homepulse-secrets:
  homepulse-frigate-config:
  homepulse-frigate-media:
  homepulse-hass-config:
