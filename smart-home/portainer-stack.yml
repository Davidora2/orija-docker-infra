    command:
      - |
        set -eu
        test -f /app/shared/pyproject.toml || (echo "App bundle missing — redeploy stack" && exit 1)


        pip install --no-cache-dir -q /app/shared -r /app/services/mqtt-ingest/requirements.txt
        cp /app/services/mqtt-ingest/worker.py /run/worker.py
        cd /run
        exec python worker.py
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      home-registry:
        condition: service_healthy
      mosquitto:
        condition: service_started

    networks: [homepulse]


