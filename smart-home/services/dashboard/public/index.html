<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Haven — Smart Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/config.js"></script>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Haven</span>
      </div>
      <p class="status" id="connStatus">Connecting…</p>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">Front door</h1>
        <p class="lede">
          Ring events flow through a secure event bus to your Google phone —
          built to grow into a full home system.
        </p>
        <div class="cta-row">
          <button type="button" class="btn-primary" id="ringBtn">
            Ring doorbell
          </button>
          <button type="button" class="btn-ghost" id="refreshBtn">Refresh</button>
        </div>
        <p class="toast" id="toast" hidden></p>
      </section>

      <section class="feed" aria-labelledby="feed-title">
        <div class="feed-head">
          <h2 id="feed-title">Live activity</h2>
          <p>Events and phone notifications from the last few minutes.</p>
        </div>
        <div class="columns">
          <div>
            <h3>Doorbell events</h3>
            <ul class="list" id="eventList"></ul>
          </div>
          <div>
            <h3>Notifications</h3>
            <ul class="list" id="notifyList"></ul>
          </div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
